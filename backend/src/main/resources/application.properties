# Server and database configuration. Environment variables keep machine-specific values out of source control.
server.port=${SERVER_PORT:8080}
spring.application.name=skillsphere

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_sphere_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" is convenient during student development. Production applications normally use migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google credentials are intentionally placeholders. Replace them with environment variables before using OAuth.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT is deliberately short lived: 30 minutes, with no refresh-token feature in this project.
# JWT_SECRET is required instead of being hardcoded in source. Use a Base64 value of at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=1800000

# Frontend URL used by CORS and the Google OAuth success redirect.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.oauth2.authorized-redirect-uri=${FRONTEND_OAUTH_REDIRECT_URL:http://localhost:5173/oauth2/callback}

# Uploaded files are served through /uploads/**. Modules store only relative file names/paths in the database.
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Swagger/OpenAPI endpoints remain public so APIs are easy to inspect during development.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
